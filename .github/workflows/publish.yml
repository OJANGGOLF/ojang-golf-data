name: Validate, publish and monitor golf catalog
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 KST daily; GitHub may delay scheduled runs
permissions:
  contents: write
jobs:
  validate_and_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate feed
        if: github.event_name != 'schedule'
        run: python build_catalog.py
      - name: Check official source pages
        run: python monitor_courses.py
      - name: Extract official PAR candidates (review only)
        run: python extract_course_candidates.py
      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: course-candidates
          path: course_candidates.csv
          retention-days: 14
      - name: Commit changed catalog and monitoring state
        run: |
          git add catalog.json course_page_state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update golf catalog and source monitoring state"
            git push
          fi
