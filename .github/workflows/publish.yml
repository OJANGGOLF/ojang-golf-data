name: Validate, publish and monitor golf catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 KST daily; GitHub may delay scheduled runs

permissions:
  contents: write

# Avoid two workflow runs trying to push the same branch at once.
concurrency:
  group: golf-catalog-main
  cancel-in-progress: false

jobs:
  validate_and_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate feed
        if: github.event_name != 'schedule'
        run: python build_catalog.py
      - name: Check official source pages
        run: python monitor_courses.py
      - name: Extract official PAR candidates (review only)
        run: python extract_course_candidates.py
      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: course-candidates
          path: course_candidates.csv
          retention-days: 14
      - name: Commit changed catalog and monitoring state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json course_page_state.json
          if git diff --cached --quiet; then
            echo "No catalog or monitoring state changes to publish."
            exit 0
          fi
          git commit -m "Update golf catalog and source monitoring state"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict: automatic update stopped without force push."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published successfully."
              exit 0
            fi
            echo "Remote branch changed during push; retrying."
            sleep 2
          done
          echo "Push rejected after 3 attempts. No force push performed."
          exit 1
