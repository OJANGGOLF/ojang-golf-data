name: Validate, publish and monitor golf catalog

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '15 0 * * *' # 09:15 KST daily; GitHub may delay scheduled runs

permissions:
  contents: write

concurrency:
  group: golf-catalog-main
  cancel-in-progress: false

jobs:
  validate_and_monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and generate feed
        if: github.event_name != 'schedule'
        run: python build_catalog.py
      - name: Check official source pages
        run: python monitor_courses.py
      - name: Extract official PAR candidates (review only)
        run: python extract_course_candidates.py
      - name: Upload review candidates
        uses: actions/upload-artifact@v4
        with:
          name: course-candidates
          path: course_candidates.csv
          retention-days: 14
      - name: Check new course candidates (review only)
        id: new_course_review
        continue-on-error: true
        run: python check_new_course_candidates.py
      - name: Upload new course review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: new-course-review
          path: new_course_review.csv
          if-no-files-found: warn
          retention-days: 14
      - name: Summarize new course review
        if: always()
        shell: bash
        run: |
          echo '## 신규 골프장 후보 검사' >> "$GITHUB_STEP_SUMMARY"
          if [ -f new_course_review.csv ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import csv
          with open('new_course_review.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          print('| 골프장 / 코스 | 검사 상태 | 메모 |')
          print('|---|---|---|')
          for r in rows:
              name = (r['골프장명'] + ' / ' + r['코스명']).replace('|', '/')
              status = r['상태'].replace('|', '/')
              note = r['검사메모'].replace('|', '/').replace('\n', ' ')[:180]
              print(f'| {name} | {status} | {note} |')
          print('\n**검토 전용:** 기존 PAR 및 공개 카탈로그는 수정하지 않습니다.')
          PY
          else
            echo '검사 결과 파일이 생성되지 않았습니다. 실행 로그를 확인하세요.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit changed catalog and monitoring state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json course_page_state.json
          if git diff --cached --quiet; then
            echo "No catalog or monitoring state changes to publish."
            exit 0
          fi
          git commit -m "Update golf catalog and source monitoring state"
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict: automatic update stopped without force push."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "Published successfully."
              exit 0
            fi
            echo "Remote branch changed during push; retrying."
            sleep 2
          done
          echo "Push rejected after 3 attempts. No force push performed."
          exit 1
